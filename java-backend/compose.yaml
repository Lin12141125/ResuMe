name: iras-java-agent
services:
  database:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: iras_agent
      POSTGRES_USER: ${DATABASE_USER:-iras_agent}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Configure DATABASE_PASSWORD in .env.real}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - iras-agent-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d iras_agent"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  iras-agent-postgres: