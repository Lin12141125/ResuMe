server.port=${SERVER_PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=24h
server.error.include-message=never
server.forward-headers-strategy=none
iras.auth.requests-per-minute=${AUTH_REQUESTS_PER_MINUTE:30}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:55432/iras_agent}
spring.datasource.username=${DATABASE_USER:iras_agent}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=51MB
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
iras.storage=${RESUME_STORAGE:./data/resumes}
iras.cors-origins=${CORS_ORIGINS:http://127.0.0.1:5173,http://127.0.0.1:5174,http://localhost:5173,http://localhost:5174}
iras.chat.base-url=${OPENAI_BASE_URL:https://api.deepseek.com}
iras.chat.api-key=${OPENAI_API_KEY:}
iras.chat.model=${OPENAI_MODEL:deepseek-chat}
iras.embedding.base-url=${EMBEDDING_BASE_URL:}
iras.embedding.api-key=${EMBEDDING_API_KEY:}
iras.embedding.model=${EMBEDDING_MODEL:}
iras.agent.max-tool-calls=8
iras.agent.max-rounds=5
iras.agent.timeout-seconds=180